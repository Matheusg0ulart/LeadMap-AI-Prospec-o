# PostgreSQL Production Profile
# Activate with: SPRING_PROFILES_ACTIVE=postgres

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/leadmap}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
app.maps.provider=${MAPS_PROVIDER:composite}
app.maps.google-api-key=${GOOGLE_MAPS_API_KEY:}
app.ai.provider=${AI_PROVIDER:rules}
app.ai.openai-api-key=${OPENAI_API_KEY:}
