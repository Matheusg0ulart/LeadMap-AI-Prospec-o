spring.application.name=leadmap-backend
server.port=8080

# H2 Database configuration (Default dev profile)
spring.datasource.url=jdbc:h2:file:./data/leadmapdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (available at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Open In View
spring.jpa.open-in-view=false

# CORS / App settings
app.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200
app.maps.provider=composite
app.maps.google-api-key=
app.ai.provider=rules
app.ai.openai-api-key=
